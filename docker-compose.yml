services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: retailpos-app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/local_retail_pos
      - JWT_SECRET=production_secret_key_change_me_super_secure_2026
    depends_on:
      - mongo

  mongo:
    image: mongo:7.0
    container_name: retailpos-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
